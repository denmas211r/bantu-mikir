<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIM Inventory Analyst</title>
  <meta name="description" content="Web kerja Inventory Analyst MIM: stok, MRP, kontrak, expediting, dan pelacakan material.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d5fae'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <div id="login" class="login">
    <form id="lf" class="login-card" autocomplete="on">
      <div class="login-brand"><div class="logo">MIM</div><div><b>MIM Inventory Analyst</b><small>Material Inventory Management</small></div></div>
      <label>Username<input id="u" autocomplete="username" required></label>
      <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" id="lb">Masuk</button>
      <p id="err" class="err" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="logo">MIM</div><div class="brand-title">Inventory Analyst<small>Material Inventory Mgmt</small></div></div>
      <nav class="nav" id="nav" aria-label="Menu utama"></nav>
      <div class="side-foot">
        <button class="side-btn" id="collapse" title="Sembunyikan menu"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg><span>Sembunyikan menu</span></button>
        <div class="side-user"><div class="avatar" id="avatar"></div><div class="who"><b id="whoName"></b><small id="whoRole"></small></div>
          <button class="icon-btn" id="out" title="Keluar" aria-label="Keluar"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg></button></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Buka menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
        <div class="toolbar" id="pageActions"></div>
      </header>
      <div class="content">
        <div class="banner" id="banner" hidden></div>
        <section id="view" class="view-root"></section>
      </div>
    </main>
  </div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/mrp.js"></script>
  <script src="js/rkm.js"></script>
  <script src="js/contract.js"></script>
  <script src="js/trace.js"></script>
  <script src="js/folder.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views.js"></script>
</body>
</html>
